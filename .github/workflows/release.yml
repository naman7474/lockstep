name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Release gates on the published package's own tests only — @lockstep/core's suite needs a
      # real Postgres (ci.yml provides one on every push; this workflow ships lockstep-cli).
      - name: Test
        run: npm run test -w lockstep-cli

      - name: Publish lockstep-cli to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish -w lockstep-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
