name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    # DB-touching tests in @lockstep/core parse DATABASE_URL at boot (env.ts) and run against a
    # real Postgres (Drizzle migrations + RLS). Provide both here; LOCKSTEP_INGEST_TOKEN lets the
    # ingest worker-endpoint tests exercise their authenticated paths.
    env:
      DATABASE_URL: postgres://lockstep:lockstep@localhost:5432/lockstep
      LOCKSTEP_INGEST_TOKEN: test-ingest-secret
      # Gateway webhook route tests exercise their signed full-flow paths only when these are set.
      GITHUB_WEBHOOK_SECRET: test-github-secret
      LOCKSTEP_SLACK_SIGNING_SECRET: test-slack-secret
      SLACK_BOT_TOKEN: xoxb-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lockstep
          POSTGRES_PASSWORD: lockstep
          POSTGRES_DB: lockstep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockstep -d lockstep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run migrations
        run: npm run db:migrate

      - name: Test
        run: npm run test
